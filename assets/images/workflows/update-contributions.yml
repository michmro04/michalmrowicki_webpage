name: Update GitHub Contributions Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Contribution Graph
        uses: Platane/snk@v3
        with:
          github_user_name: michmro04
          outputs: |
            assets/images/github-contribution-grid.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/github-contribution-grid.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: aktualizacja wykresu aktywności"
          git push